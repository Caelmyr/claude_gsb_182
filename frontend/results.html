<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>结果导出 Results — 分布式 MapReduce</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="app-nav"></header>
  <main class="page">
    <h1 class="page-title">结果查看与导出 <span>Results &amp; Export</span></h1>
    <p class="page-desc">查看各分区结果并导出 JSON / CSV。Inspect partition results and export as JSON / CSV.</p>

    <div class="flex between mb">
      <div id="job-picker" style="min-width:280px"></div>
      <div class="flex">
        <a class="btn primary small" id="dl-json" href="#">导出 JSON</a>
        <a class="btn small" id="dl-csv" href="#">导出 CSV</a>
      </div>
    </div>

    <div class="stat-tiles" id="stats"></div>
    <div class="grid cols-2 mt">
      <div class="card"><h2>结果分区 <span class="sub">Partitions</span></h2><div id="partitions"></div></div>
      <div class="card"><h2>结果预览 <span class="sub">Preview — 点击任意行追溯血缘</span></h2><div id="preview"></div></div>
    </div>

    <div class="card mt">
      <h2>数据血缘追溯 <span class="sub">Result Lineage — 输入分片 → Map → Shuffle → Reduce → 分区</span></h2>
      <div class="flex mb" style="flex-wrap:wrap">
        <input id="lineage-key" class="input" type="text" placeholder="输入结果 Key 追溯 trace by key…" style="min-width:260px">
        <button class="btn primary small" id="lineage-go">追溯 Trace</button>
        <select id="lineage-partition" class="input" style="min-width:180px"></select>
        <span class="muted small" id="lineage-hint"></span>
      </div>
      <div id="lineage"></div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages/results.js"></script>
</body>
</html>
